[package]
name = "runmarq-collector"
description = "Local event collector: ingestion, run state engine, forecasts, local API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runmarq-core.workspace = true
runmarq-storage.workspace = true
runmarq-estimator.workspace = true
runmarq-adapters.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
futures.workspace = true
tokio-stream.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true
fs4.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
