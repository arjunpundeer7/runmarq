[package]
name = "runmarq-cli"
description = "The runmarq command: hook ingestion, agent wrapper, integrations, collector control."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "runmarq"
path = "src/main.rs"

[dependencies]
runmarq-core.workspace = true
runmarq-storage.workspace = true
runmarq-estimator.workspace = true
runmarq-adapters.workspace = true
runmarq-collector.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
